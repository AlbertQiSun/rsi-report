  phase: 4
  kind: run
  after: [cf_m1_r1, cf_m1p_r1]
  requires_flags: ["!ladder27b_remote", nanochat]
  wait_for_flags: [ladder27b_local_up]
  skip_if_flags: [ladder27b_local_failed]
  plan: "only on fallback: 1 thread × 20 trials on lane 1"
  run: {model: ladder-27b, lanes: [1], policy_cfg: {threads: 1}, budget: {trials: 20}, rng_seed: 1100}
  fake: {needs_up: vllm_27b}
  stop_when_trials: 20
  est_trial_s: 660
  est_s: 13200
  latest_start: "2026-11-18T19:00"
  deadline: "2026-11-18T20:45"

