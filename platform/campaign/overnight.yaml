# ─────────────── Phase 4 (11-18 afternoon/night): comparison policies; 27B fallback ───────────────
- id: ladder_fb_host         # ONLY if the remote 27B failed its gate: host 27B on GPU2 (lane 2 paused)
  phase: 4
  kind: service
  after: [cf_m1_r1, cf_m1p_r1]
  requires_flags: ["!ladder27b_remote", nanochat]
  holds: [gpu2]
  lane: 2
  cmd: serve_27b_local
  probe: vllm_27b
  url: "http://127.0.0.1:{port:vllm_27b}/v1/models"
  up_flag: ladder27b_local_up
  fail_flags: {ladder27b_local_failed: true}
  until: [ladder_fb_nc]
  load_s: 600
  plan: "only on fallback: 11-18 16:00–20:00"
  est_s: 14400
  deadline: "2026-11-18T21:00"

