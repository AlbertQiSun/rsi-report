# ═══════════════ 27B self-evolution chain (added 11-18 ≈00:40; mirrors the 9B second-order chain) ═══════════════
# Improver I_0 = Qwen3.8-27B ("ladder-27b", node-c, unchanged). Same tasks, seeds, N and rule as the 9B chain.
# A0 for 27B = ladder_mu (27B, held-out, seeds 100-104, N 12, karpathy_greedy: identical protocol to mu_a0a).
# U_w adapters are trained AND served on node-d (job 10000004, 2 × A100): train (both GPUs, device_map) ->
# serve 27B + adapters (TP=2, LORA_MODULES preloaded) -> held-out arms -> stop -> next generation.
# Pacing 〔估算〕: 27B µAR step ≈ 20 s (vs 8 s for 9B); a 27B µAR arm ≈ 1.5 h in the shared 24-run CPU pool
# (these steps come last in the file, so the 9B arms get the pool first); 27B LoRA ≈ 2.5 h per adapter on
# 2 × A100; 27B vLLM TP=2 start ≈ 15 min. Deadlines are loose on purpose: added to a running campaign, the chain
# must slip rather than be skipped if the restart happens later than planned. The second-order comparison U_w(27B) uses a different serving
# instance (node-d) than its base arm ladder_mu (node-c): same weights, dtype, TP and vLLM flags.
