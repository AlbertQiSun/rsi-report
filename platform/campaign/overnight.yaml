# RSI-mini overnight campaign: the concrete plan (worker F).
#   python -m rsi.campaign --config campaign/overnight.yaml --check      # print the plan
#   bash bundle/run_campaign.sh                                          # on the cluster (see deploy/campaign.md)
#   python -m rsi.campaign --config campaign/overnight.yaml --dry-run    # fake components, compressed clock
#
# Every duration or throughput marked 〔估算〕 is an ESTIMATE taken from research/platform_build_plan.md
# §6.4–6.5 and the coordinator's brief. None of them has been measured. After the Phase-0 gates,
# replace them with measured values and re-check the clock times (--check).
#   NanoChat eval (5-min run + startup + scoring) ≈ 7 min 〔估算〕 → one lane ≈ 8.5 evals/h
#   9B agent thinking ≈ 2–3 min/trial → one 9B thread ≈ 6 trials/h when it has a lane to itself 〔估算〕
#   27B agent thinking ≈ 4 min/trial 〔估算〕
#   27B: 2 threads pinned to ONE lane are lane-bound: ≈ 8.5 evals/h for the run 〔估算〕
#   est_trial_s = run wall-clock per finished trial, all threads of the run together (used for pacing
#   checks and dry-run fakes)
#   LoRA training ≈ 45 min per adapter (30–60) 〔估算〕; µAR step (proposal + CPU eval) ≈ 8 s 〔估算〕
#
# Resources (Beijing time):
#   node-a (job 10000001, until 11-19 20:01): GPU0 = vLLM 9B, GPU1/GPU2 = eval lanes 1/2, 36 CPUs (µAR)
#   node-b (job 10000002, 2 days):            eval lanes 3/4/5 (remote lanes in evald, worker B)
#   node-c (job 10000003, until ≈11-19 20:45): Qwen3.8-27B, TP=2, gateway model "ladder-27b"
# 5 lanes ≈ 42 evals/h 〔估算〕. Lanes are PINNED per run (policies: thread i -> lanes[i % len(lanes)]):
#   lane 2 (local GPU2) is the LoRA lane: overnight it only trains adapters, so no G0 thread depends on it;
#   9B G0 = lanes 1,3,4 (one thread each); 27B ladder = lane 5 (two threads). LoRA must be on a LOCAL GPU
#   (the campaign process runs on node-a), which is why it is lane 2 and not a lane on node-b.
#
# Step kinds (rsi/campaign/scheduler.py):
#   cmd       one command; `checks` make it a gate; `cache` = reuse a passing result from deployment
#   run       one orchestrator run; `stop_when_trials` = trial-count trigger; `deadline` = graceful stop
#   muar_arm  one orchestrator run per (task, seed) on the shared CPU pool; Δ₂ uses run_end.nAUC
#   lessons   U_s: rsi.update.write_lessons;  sft: rsi.update.build_sft_data (min_examples = gate G3)
#   lora      pause lane → wait idle → train adapters on the lane's GPU → load into vLLM → resume lane
#   service   host a server on a lane's GPU (only used by the 27B fallback)
#   decision  pre-registered Δ₂ rule (platform_design.md §1.4); sets flags; emits a `decision` event
#   endpoint  top-k artifacts × 10 seeds through evald
# Triggers: after (finished in any state), needs (must have succeeded, else skip), requires_flags /
# skip_if_flags (checked once deps finish), wait_for_flags, not_before, latest_start (skip if passed),
# deadline (graceful stop; partial results kept), holds (mutual exclusion, e.g. gpu2).

campaign: ovn1118b           # restarted 11-17 23:55 after the harness-config fix (ovn1118 aborted)
task: overnight
tz: "+08:00"                       # every clock time below is Beijing time
planned_start: "2026-11-17T22:45"  # platform deployed ≈22:30; the campaign starts with the gates (P0)
gpu_stop: "2026-11-19T18:00"       # nothing new on GPUs after this; running work is stopped gracefully
hold_end: "2026-11-19T20:01"       # job 10000001 ends; 2 h margin for stop + pack

paths:
  R: /scratch/user/rsi      # $R overrides
  runs_root: "{R}/runs"
  campaign_dir: "{R}/runs/campaign-{campaign}"
  status_md: "{R}/runs/campaign_status.md"
  adapters: "{R}/adapters/{campaign}"
  ports: "{R}/run/ports.json"      # keys used: gateway, evald, vllm_improver (written by C's/B's scripts)
  token: "{R}/run/token"
  gates: "{R}/runs/gates"
  nanochat_start: "{R}/tasks/nanochat/start"   # vanilla start dir for the endpoint re-score (assumption, NOTES_F.md)

python:
  serve: /scratch/user/miniconda3/envs/rsi/bin/python
  train: "{R}/envs/rsi-train/bin/python"

base_model: Qwen/Qwen3.5-9B
gateway_url: "{url:gateway}/v1"
evald_url: "{url:evald}"
lora_admin:   # gateway admin API (worker C) -> vLLM /v1/load_lora_adapter as "improver@<name>"; vLLM needs --lora
  base: improver
  load_url: "{url:gateway}/rsi/load_adapter"
  list_url: "{url:gateway}/rsi/adapters"

commands:     # templates; {config} {out} {sft_dir} {adapter_out} {gpu} {model} are filled per step
  orchestrator: "{py} -m rsi.orchestrator --config {config}"
  lora_train: "bash {bundle}/lora_train.sh {sft_dir} {adapter_out} {gpu}"
  noise_floor: "env MODE=evald bash {bundle}/noise_floor.sh 20 1,2,3,4,5"   # 4 seeds per lane; JSON summary (B)
  toolcall: "{py} {bundle}/toolcall_test.py --model {model} --out {out}"   # (C)
  evald_selftest: "{py} -m rsi.evald.selftest"                 # exit 0 only if every check passes (B)
  muar_baselines: "{py} -m rsi.tasks.muar.runner baseline --method random,local --split heldout --rng-seeds 100,101,102,103,104 --n 12 --workers 8 --out {out}"
  serve_27b_local: "bash {bundle}/serve_vllm.sh 27b {gpu}"
  restart_vllm: "bash {bundle}/serve_vllm.sh 9b 0 --lora"
  pack: "tar -czf {R}/out/{campaign}-runs.tgz -C {R} runs"
  # 27B self-evolution chain on node-d (job 10000004, 2 × A100); both run inside `remote:` srun steps.
  # Training: D's trainer with the 27B base split over both GPUs (device_map=auto, gradient checkpointing).
  lora_train_27b: "env RSI_BASE_MODEL=Qwen/Qwen3.8-27B RSI_LORA_DEVICE_MAP=auto LORA_TIME_LIMIT_MIN=150 bash -c 'exec bash \"$0\" \"$1\" \"$2\" \"$CUDA_VISIBLE_DEVICES\"' {bundle}/lora_train.sh {sft_dir} {adapter_out}"
  # Serving: C's script, second 27B base "ladder-27b-evo" (TP=2, adapters preloaded as ladder-27b-evo@<name>),
  # exposed through an edge gateway; ports.json key "ladder-27b-evo" -> the main gateway routes it.
  serve_27b_evo: "env SERVED_NAME=ladder-27b-evo LORA_MODULES={lora_modules} MAX_LORAS=2 bash {bundle}/serve_vllm.sh 27b slurm --lora --expose"

lanes: [1, 2, 3, 4, 5]
lane_gpus: {1: 1, 2: 2}      # local lanes only; lanes 3-5 live on node-b
lora_lane: 2                 # LoRA always borrows lane 2 / local GPU2
tick_s: 10
status_interval_s: 3600      # hourly line in runs/campaign_status.md (plus a line at every gate/decision/alert)
stop_grace_s: 900            # a run gets 15 min to reach a trial boundary after PAUSE, then SIGTERM
max_restarts: 3              # per run, with --resume, backoff 2/4/6 min
restart_backoff_s: 120
analysis: {n_boot: 10000, floor: per_task}   # rsi.update.analysis (D): floor = 2 × sd of per-task A/A diffs
dry_run:                     # --dry-run only: fake components, compressed clock, smaller µAR fan-out
  time_scale: 2000           # 1 real s = 2000 virtual s: the whole plan replays in ≈1 min
  muar_tasks_per_split: 2    # (fake sub-runs cost ≈0.25 real s each; the full fan-out would outrun the clock)
  muar_seeds: 2
  n_boot: 300

flags:                       # defaults; gates and decisions flip them
  nanochat: true             # G1a/G1c: NanoChat usable at all
  nanochat_9b: true          # G1b: 9B tool calling good enough for NanoChat
  nanochat_noisy: true       # user decision 2026-11-17 23:10: G1a sd 0.0268 > 0.02 -> keep needs a confirming seed
  muar: true                 # G2 smoke
  ladder27b_remote: true     # 27B gate on its own node
  uw1_harmful: false
  uw2_harmful: false
  uw1_27b_harmful: false

health:
  interval_s: 180            # every 3 min
  fail_threshold: 2          # 2 failed probes in a row = outage: agent runs get PAUSE, no new µAR runs
  max_service_restarts: 2    # per service per campaign; after that an ALERT line asks for a human
  disk_min_free_gb: 50
  disk_hard_min_gb: 10       # below this: pause runs
  serving_gpu: 0
  gpu_min_free_gb: 1.0
  services:
    - {name: vllm, url: "{url:vllm_improver}/v1/models", critical: true,
       restart_cmd: restart_vllm, long_running: true, restart_wait_s: 900, reload_adapters: true}
    - {name: gateway, url: "{url:gateway}/health", critical: true}
    - {name: evald, url: "{url:evald}/health", critical: true}

muar:
  cpu_workers: 24            # concurrent µAR runs (1 CPU each); the rest serve vLLM, evald, harness, gateway
  N: 12                      # proposals per (task, seed), as pre-registered in platform_design.md §5.1
  est_step_s: 8              # 〔估算〕
  sref: "{R}/data/sealed/muar/sref.json"   # D's s_ref table (sealed; read only by the analysis subprocess)
  run_extra:                 # merged into every µAR run config: CPU scoring via D's LocalEvalClient
    evald: {factory: "rsi.campaign.factories:muar_evald", workers: 1}
    harness:                 # µAR proposals are small JSON configs: the in-repo mini harness (same bwrap sandbox, no web)
      kind: mini
      sandbox: bwrap
      gateway_url: null
      gateway_ports_key: gateway_agent
      api_key_file: "{R}/run/agent_token"
      python: /scratch/user/miniconda3/envs/rsi/bin/python
      platform_dir: "{R}/platform"
      ro_paths: [/scratch/user/miniconda3/envs/rsi, "{R}/envs/rsi-train", "{R}/platform"]
      sandbox_path: "{R}/envs/rsi-train/bin:/scratch/user/miniconda3/envs/rsi/bin:/usr/local/bin:/usr/bin:/bin"
      web: false
      subagents: false
      context_tokens: 65536
      max_output_tokens: 8192
  tasks:                     # rsi.tasks.muar.tasks.SPLITS
    train: [muar/train-modadd-0, muar/train-modadd-1, muar/train-parity-0, muar/train-parity-1,
            muar/train-teacher-0, muar/train-teacher-1, muar/train-cls2d-0, muar/train-cls2d-1]
    heldout_id: [muar/id-modadd-0, muar/id-parity-0, muar/id-teacher-0, muar/id-cls2d-0]
    heldout_ood: [muar/ood-copyrev-0, muar/ood-dyck-0, muar/ood-icl-0, muar/ood-charlm-0]
  heldout: [heldout_id, heldout_ood]
  policy: karpathy_greedy
  seeds:
    smoke: [0]
    g0: [0, 1, 2, 3, 4]          # D_0      (M0 on train)            8×5×12 = 480 proposals
    d1: [5, 6, 7, 8, 9]          # D_1 = M1 on train; D_0' = M0 on the same seeds ("more M0 data")
    d2: [10, 11, 12, 13, 14]     # D_2 = M2 on train; D_0'' = M0 on the same seeds
    heldout: [100, 101, 102, 103, 104]   # every held-out arm (common random numbers, paired with A0a)
    aa: [200, 201, 202, 203, 204]        # A0b only: A/A noise floor

run_defaults:
  harness:                     # 2026-11-17 fix: campaign run configs had NO harness block -> "opencode" not found in bwrap
    kind: opencode
    sandbox: bwrap
    opencode_bin: "{R}/tools/opencode/current/package/bin/opencode"
    gateway_url: null
    gateway_ports_key: gateway_agent
    api_key_file: "{R}/run/agent_token"
    python: /scratch/user/miniconda3/envs/rsi/bin/python
    platform_dir: "{R}/platform"
    ddg_cmd: ["{R}/envs/mcp/bin/duckduckgo-mcp-server"]
    fetch_cmd: ["{R}/envs/mcp/bin/mcp-server-fetch"]
    ro_paths: [/scratch/user/miniconda3/envs/rsi, "{R}/envs/mcp", "{R}/envs/rsi-train", "{R}/platform", "{R}/tools/opencode"]
    sandbox_path: "{R}/envs/rsi-train/bin:/usr/local/bin:/usr/bin:/bin"
    web: true
    subagents: true
    export: true
    context_tokens: 65536
    max_output_tokens: 8192
  task: nanochat
  policy: karpathy_greedy
  model: improver
  scaffold_dir: null
  lanes: [1]
  budget: {episode_s: 600}
  seeds: [0]                 # screening dev seed (Karpathy's fixed seed)
  policy_cfg: {}             # lanes pinned: thread i -> lanes[i % len(lanes)]

steps:
# ═══════════════════ Phase 0: gates (planned 11-17 22:45–23:25; must finish by 11-18 00:15) ═══════════════════
- id: g1a_noise
  phase: 0
  kind: cmd
  cmd: noise_floor
  plan: "11-17 22:45–23:15"
  est_s: 1800                # 20 vanilla seeds over 5 lanes = 4 per lane × 7 min 〔估算〕
  cache: "{gates}/g1a_noise.json"
  deadline: "2026-11-18T00:15"
  checks: {dev_bpb.sd: "<= 0.03", job_wall_s.max: "<= 600", status_counts.ok: ">= 18"}   # sd threshold relaxed by user together with nanochat_noisy=true
  on_fail:
    wait_human_s: 1200
    fallbacks:
      - if: {status_counts.ok: ">= 10"}
        set_flags: {nanochat_noisy: true}
        status: done
        note: "noisy: every keep needs a confirming seed; NanoChat budgets ×0.8"
      - set_flags: {nanochat: false}
        note: "vanilla does not run: drop NanoChat, µAR only"

- id: g1b_toolcall
  phase: 0
  kind: cmd
  cmd: toolcall
  model: improver
  plan: "11-17 22:45–23:05"
  est_s: 1200
  cache: "{gates}/g1b_toolcall.json"
  deadline: "2026-11-18T00:15"
  checks: {call_validity_rate: ">= 0.90", episode_completion_rate: ">= 0.70"}
  on_fail:
    wait_human_s: 1800       # time to try another parser / tool_choice=required
    fallbacks:
      - set_flags: {nanochat_9b: false}
        note: "9B only does µAR (JSON proposals); NanoChat agent work is left to 27B"

- id: g1b_27b
  phase: 0
  kind: cmd
  cmd: toolcall
  model: ladder-27b
  plan: "11-17 22:45–23:05"
  est_s: 1200
  cache: "{gates}/g1b_27b.json"
  deadline: "2026-11-18T00:15"
  checks: {call_validity_rate: ">= 0.90", episode_completion_rate: ">= 0.70"}
  on_fail:
    wait_human_s: 1200
    fallbacks:
      - set_flags: {ladder27b_remote: false}
        note: "remote 27B unusable: ladder moves to GPU2 (lane 2) after the last LoRA (ladder_fb_*)"

- id: g1c_evald
  phase: 0
  kind: cmd
  cmd: evald_selftest
  plan: "11-17 22:45–22:55"
  est_s: 600
  deadline: "2026-11-18T00:15"
  checks: {}                 # the self-test's exit code is the gate
  on_fail:
    wait_human_s: 3600       # plan §6.8: do not start NanoChat on an evaluator that fails its self-tests
    fallbacks:
      - set_flags: {nanochat: false}
        note: "evaluator self-test failed: NanoChat off, µAR only"

- id: g2_muar_smoke
  phase: 0
  kind: muar_arm
  splits: train
  task_index: [0, 1]
  seeds: smoke
  N: 20
  plan: "11-17 22:45–23:00"
  est_s: 900
  deadline: "2026-11-18T00:15"
  checks: {ok_rate: ">= 0.70", mean_wall_s: "< 5"}       # design Gate 1
  on_fail:
    wait_human_s: 1800
    fallbacks:
      - set_flags: {muar: false}
        note: "µAR off: no second-order arms tonight"

# ═══════════ Phase 1: first-order G0 + capability ladder (starts when all gates resolved, ≈23:30) ═══════════
- id: nc_g0                  # 9B, vanilla start, 3 threads pinned to lanes 1, 3, 4
  phase: 1
  kind: run
  after: [g1a_noise, g1b_toolcall, g1b_27b, g1c_evald, g2_muar_smoke]
  requires_flags: [nanochat, nanochat_9b]
  plan: "11-17 23:30 – 11-18 04:15"
  run:
    policy: karpathy_greedy
    model: improver
    lanes: [1, 3, 4]
    policy_cfg: {threads: 3, trials_per_thread: 30}
    budget: {trials: 90}
    rng_seed: 1000
  overlays: [{when: nanochat_noisy, set: {policy_cfg: {confirm_seeds: [1]}, budget: {trials: 72}}}]
  stop_when_trials: 90       # trial-count trigger: G0 ends at 3 × 30 trials → NanoChat P2/P3 begin
  est_trial_s: 190           # run wall-clock per trial: 3 threads × ≈6.3 trials/h 〔估算〕
  est_s: 17100
  deadline: "2026-11-18T07:30"
  stall_s: 2400
  abort_if: {min_trials: 12, ok_rate_lt: 0.2}

- id: ladder_nc              # capability ladder: same protocol with 27B, in parallel, 2 threads on lane 5
  phase: 1
  kind: run
  after: [g1a_noise, g1b_toolcall, g1b_27b, g1c_evald, g2_muar_smoke]
  requires_flags: [nanochat, ladder27b_remote]
  plan: "11-17 23:30 – 11-18 06:30"
  run:
    policy: karpathy_greedy
    model: ladder-27b
    lanes: [5]
    policy_cfg: {threads: 2, trials_per_thread: 30}
    budget: {trials: 60}
    rng_seed: 1100
  overlays: [{when: nanochat_noisy, set: {policy_cfg: {confirm_seeds: [1]}, budget: {trials: 48}}}]
  stop_when_trials: 60
  est_trial_s: 420           # lane-bound: one lane ≈ 8.5 evals/h 〔估算〕
  est_s: 25200
  deadline: "2026-11-18T09:00"
  stall_s: 2400
  abort_if: {min_trials: 12, ok_rate_lt: 0.2}

- id: mu_g0                  # D_0
  phase: 1
  kind: muar_arm
  after: [g2_muar_smoke]
  requires_flags: [muar]
  splits: train
  seeds: g0
  model: improver
  gen: 0
  plan: "11-17 23:30 – 11-18 00:10"
  est_s: 2400
  deadline: "2026-11-18T02:30"

- id: mu_a0a                 # held-out baseline M0 σ0
  phase: 1
  kind: muar_arm
  after: [g2_muar_smoke]
  requires_flags: [muar]
  splits: heldout
  seeds: heldout
  model: improver
  gen: 0
  plan: "11-17 23:30 – 11-18 00:15"
  est_s: 2400
  deadline: "2026-11-18T03:30"

- id: mu_a0b                 # A/A: same improver, disjoint seeds
  phase: 1
  kind: muar_arm
  after: [g2_muar_smoke]
  requires_flags: [muar]
  splits: heldout
  seeds: aa
  model: improver
  gen: 0
  plan: "11-17 23:30 – 11-18 00:20"
  est_s: 2400
  deadline: "2026-11-18T03:30"

- id: mu_baselines           # non-LLM baselines R (random) and R-local on held-out, D's runner CLI
  phase: 1
  kind: cmd
  cmd: muar_baselines
  after: [g2_muar_smoke]
  requires_flags: [muar]
  plan: "11-17 23:30–23:40"
  est_s: 600
  deadline: "2026-11-18T03:30"
  checks: {}
  on_fail: {fallbacks: [{status: done, note: "no baselines: Gate 2 recorded as no data"}]}

- id: g2b_beats_rlocal       # design Gate 2: M0 must beat local perturbation on held-out
  phase: 1
  kind: decision
  needs: [mu_a0a]
  after: [mu_baselines]
  arm: mu_a0a
  base: "mu_baselines:R-local"
  label: "Gate2 M0 vs R-local"
  require: "> 0"
  plan: "11-18 ≈00:20"
  on_fail:
    wait_human_s: 1200
    fallbacks:
      - set_flags: {muar_gate2_failed: true}
        status: done
        note: "continue, but every µAR Δ₂ is labelled 'Gate 2 failed' (task may be too hard for M0)"

# ═══════════════════════ Phase 2: U_s (lessons) on µAR ═══════════════════════
- id: us_lessons_mu
  phase: 2
  kind: lessons
  needs: [mu_g0]
  sources: [mu_g0]
  model: improver
  gen: 1
  plan: "11-18 00:10–00:20"
  est_s: 600

- id: us_placebo_mu          # placebo: same length, written without reading trajectories
  phase: 2
  kind: lessons
  needs: [mu_g0, us_lessons_mu]
  sources: [mu_g0]
  generic_placebo: true
  match_words_of: us_lessons_mu
  out_dir: "{campaign_dir}/scaffolds/us_placebo_mu-placebo"
  model: improver
  gen: 1
  plan: "11-18 00:20–00:30"
  est_s: 600

- id: mu_a1                  # A1 = M0 + σ1 (also the retrieval control for U_w)
  phase: 2
  kind: muar_arm
  needs: [us_lessons_mu]
  splits: heldout
  seeds: heldout
  model: improver
  scaffold: "lessons:us_lessons_mu"
  gen: 1
  plan: "11-18 00:20–01:00"
  est_s: 2400
  deadline: "2026-11-18T04:00"

- id: mu_a1p
  phase: 2
  kind: muar_arm
  needs: [us_placebo_mu]
  splits: heldout
  seeds: heldout
  model: improver
  scaffold: "lessons:us_placebo_mu"
  gen: 1
  plan: "11-18 00:30–01:10"
  est_s: 2400
  deadline: "2026-11-18T04:00"

- id: dec_us
  phase: 2
  kind: decision
  needs: [mu_a1, mu_a0a]
  after: [mu_a1p, mu_a0b]
  arm: mu_a1
  base: mu_a0a
  placebo: mu_a1p
  aa: [mu_a0a, mu_a0b]
  label: "Δ₂(0) U_s lessons"
  label_if_flag: [muar_gate2_failed, "(Gate 2 failed)"]
  set_flags: {us1_pass: pass}
  plan: "11-18 ≈01:10"

# ═══════════════ Phase 3: U_w LoRA, three generations on µAR (lane 2 = LoRA lane) ═══════════════
- id: sft_m1
  phase: 3
  kind: sft
  needs: [mu_g0]
  sources: [mu_g0]
  accepted_only: true
  min_examples: 40           # gate G3 (accepted steps)
  plan: "11-18 00:10–00:15"
  est_s: 300
  on_fail: {fallbacks: [{note: "fewer than 40 accepted steps: U_w gen 1 skipped (D_0 too small)"}]}

- id: sft_m1p
  phase: 3
  kind: sft
  needs: [mu_g0]
  sources: [mu_g0]
  placebo: true              # same count of valid-but-rejected steps
  min_examples: 40
  plan: "11-18 00:10–00:15"
  est_s: 300
  on_fail: {fallbacks: [{note: "placebo SFT set too small"}]}

- id: lora_g1
  phase: 3
  kind: lora
  needs: [sft_m1, sft_m1p]
  holds: [gpu2]
  lane: 2
  gen: 1
  jobs: [{name: m1, sft: sft_m1}, {name: m1p, sft: sft_m1p}]
  est_train_s: 2700          # 〔估算〕 per adapter
  train_timeout_s: 5400
  plan: "11-18 00:15–01:55 (lane 2)"
  est_s: 6000
  deadline: "2026-11-18T04:30"

