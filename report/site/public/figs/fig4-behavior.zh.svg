<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-label="调用次数与输出长度" style="font-family:inherit;width:100%;height:auto"><style>
.f4 .flow{stroke-dasharray:5 6;}
.in .f4 .flow{animation:f4dash 1.1s linear infinite;}
@keyframes f4dash{to{stroke-dashoffset:-11}}
.f4 .draw{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);}
.in .f4 .draw{animation:f4draw 2.4s cubic-bezier(.3,.7,.2,1) forwards;animation-delay:var(--d,0s);}
@keyframes f4draw{to{stroke-dashoffset:0}}
.f4 .pop{opacity:0;}
.in .f4 .pop{animation:f4pop .5s ease-out forwards;animation-delay:var(--d,0s);}
@keyframes f4pop{from{opacity:0}to{opacity:1}}
.f4 .grow{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);}
.in .f4 .grow{animation:f4grow 1.2s cubic-bezier(.3,.7,.2,1) forwards;animation-delay:var(--d,0s);}
@keyframes f4grow{to{transform:scaleX(1)}}
.f4 .pulse{animation:f4pulse 2.4s ease-in-out infinite;}
@keyframes f4pulse{0%,100%{opacity:.55}50%{opacity:1}}
</style><g class="f4"><line x1="156.6" y1="50.0" x2="156.6" y2="270.0" stroke="#e1e0d9" stroke-width="1"/><text x="156.6" y="288.0" font-size="10.5" fill="#898781" text-anchor="middle" font-weight="400">2,000</text><line x1="368.9" y1="50.0" x2="368.9" y2="270.0" stroke="#e1e0d9" stroke-width="1"/><text x="368.9" y="288.0" font-size="10.5" fill="#898781" text-anchor="middle" font-weight="400">5,000</text><line x1="529.4" y1="50.0" x2="529.4" y2="270.0" stroke="#e1e0d9" stroke-width="1"/><text x="529.4" y="288.0" font-size="10.5" fill="#898781" text-anchor="middle" font-weight="400">10,000</text><line x1="690.0" y1="50.0" x2="690.0" y2="270.0" stroke="#e1e0d9" stroke-width="1"/><text x="690.0" y="288.0" font-size="10.5" fill="#898781" text-anchor="middle" font-weight="400">20,000</text><line x1="90.0" y1="248.0" x2="690.0" y2="248.0" stroke="#e1e0d9" stroke-width="1"/><text x="82.0" y="252.0" font-size="10.5" fill="#898781" text-anchor="end" font-weight="400">40</text><line x1="90.0" y1="204.0" x2="690.0" y2="204.0" stroke="#e1e0d9" stroke-width="1"/><text x="82.0" y="208.0" font-size="10.5" fill="#898781" text-anchor="end" font-weight="400">60</text><line x1="90.0" y1="160.0" x2="690.0" y2="160.0" stroke="#e1e0d9" stroke-width="1"/><text x="82.0" y="164.0" font-size="10.5" fill="#898781" text-anchor="end" font-weight="400">80</text><line x1="90.0" y1="116.0" x2="690.0" y2="116.0" stroke="#e1e0d9" stroke-width="1"/><text x="82.0" y="120.0" font-size="10.5" fill="#898781" text-anchor="end" font-weight="400">100</text><line x1="90.0" y1="72.0" x2="690.0" y2="72.0" stroke="#e1e0d9" stroke-width="1"/><text x="82.0" y="76.0" font-size="10.5" fill="#898781" text-anchor="end" font-weight="400">120</text><text x="390.0" y="308.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="400">未见过任务上的调用次数（对数刻度）</text><text x="16.0" y="30.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="400">每次输出长度中位数（token）</text><ellipse cx="158.7" cy="102.8" rx="44" ry="34" fill="#e3eefb" class="pulse"/><ellipse cx="599.0" cy="224.9" rx="112" ry="34" fill="#fde8de" class="pulse"/><text x="212.7" y="67.6" font-size="11" fill="#2a78d6" text-anchor="start" font-weight="600">未训练 / 轻度训练</text><text x="599.0" y="173.2" font-size="11" fill="#eb6834" text-anchor="middle" font-weight="600">高强度训练（rank 32 · lr 3e-4）</text><circle cx="160.1" cy="91.8" r="7" fill="#2a78d6" stroke="#ffffff" stroke-width="2" class="pop" style="--d:0.2s"><title>原始模型：调用 2,030 次，输出中位数 111 token [LOG E]</title></circle><text x="172.1" y="83.8" font-size="10.8" fill="#52514e" text-anchor="start" font-weight="400">原始模型</text><circle cx="157.4" cy="113.8" r="7" fill="#2a78d6" stroke="#ffffff" stroke-width="2" class="pop" style="--d:0.4s"><title>第二轮（轻度训练）：调用 2,007 次，输出中位数 101 token [LOG E]</title></circle><text x="169.4" y="129.8" font-size="10.8" fill="#52514e" text-anchor="start" font-weight="400">第二轮（轻度训练）</text><circle cx="618.5" cy="223.8" r="7" fill="#eb6834" stroke="#ffffff" stroke-width="2" class="pop" style="--d:0.6s"><title>第一轮：调用 14,689 次，输出中位数 51 token [LOG E]</title></circle><text x="618.5" y="209.8" font-size="10.8" fill="#52514e" text-anchor="middle" font-weight="400">第一轮</text><circle cx="557.5" cy="217.2" r="7" fill="#eb6834" stroke="#ffffff" stroke-width="2" class="pop" style="--d:0.8s"><title>第三轮：调用 11,287 次，输出中位数 54 token [LOG E]</title></circle><text x="545.5" y="221.2" font-size="10.8" fill="#52514e" text-anchor="end" font-weight="400">第三轮</text><circle cx="624.7" cy="232.6" r="7" fill="#eb6834" stroke="#ffffff" stroke-width="2" class="pop" style="--d:1.0s"><title>第三轮的随机配方：调用 15,087 次，输出中位数 47 token [LOG E]</title></circle><text x="630.7" y="254.6" font-size="10.8" fill="#52514e" text-anchor="start" font-weight="400">第三轮的随机配方</text></g></svg>